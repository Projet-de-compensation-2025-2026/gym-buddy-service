# Local laptop stack only. Do not run this file on the VPS.
# VPS data plane is deploy/compose.yaml (private network, loopback operator ports).
# VPS API replace stays deploy/replace.sh + docker run on 127.0.0.1:8080.
# Runbook: gym-buddy-documentation 10-Getting-started/04-Environment-and-pipeline.md
#
#   cp .env.example .env
#   docker compose up -d
#
# MailHog is optional: docker compose --profile mail up -d

name: gym-buddy

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      FIXTURE_SEED: ${FIXTURE_SEED:-20260813}
      DATABASE_URL: postgresql://gymbuddy:${POSTGRES_PASSWORD}@postgres:5432/gymbuddy
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:8333
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: gym-buddy-postgres:18.6-secure
    build: ./deploy/postgres
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=C.UTF-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_icu_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbuddy -d gymbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -master.telemetry=false
      - -s3.allowedOrigins=http://localhost:5173,http://127.0.0.1:5173
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  postgres_icu_data:
  seaweedfs_data:
