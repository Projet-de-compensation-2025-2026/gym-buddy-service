name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        run: bash .github/scripts/ci/setup_java.sh

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Format
        run: bash .github/scripts/ci/format.sh --write

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "no formatting changes"
          else
            git commit -m "style: apply formatter"
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
          fi

      - name: Test
        run: bash .github/scripts/ci/test.sh

      - name: Require integration execution
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in pathlib.Path('target/surefire-reports').glob('TEST-*.xml')]
          required = {'AuthIT', 'ProfilesIT', 'ConversationsIT', 'EventsIT', 'MediaIT', 'ReadinessIT', 'FixtureGeneratorIT'}
          present = {suite.get('name', '').split('.')[-1] for suite in suites}
          assert required <= present, f'Missing integration suites: {required - present}'
          totals = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] > 0 and not any(totals[key] for key in ('failures', 'errors', 'skipped')), totals
          PY

      - name: Validate media gateway configuration
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Smoke (container must respond)
        run: bash .github/scripts/ci/smoke.sh

      - name: Audit runtime image vulnerabilities
        run: |
          mkdir -p image-audit
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/image-audit:/reports" \
            aquasec/trivy:0.74.0 image --scanners vuln --severity CRITICAL --exit-code 1 \
            --format json --output /reports/critical.json gym-buddy-service:smoke

      - name: Preserve test and runtime audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-verification
          path: |
            target/surefire-reports/
            image-audit/
