name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        run: bash .github/scripts/ci/setup_java.sh

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Format
        run: bash .github/scripts/ci/format.sh --write

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "no formatting changes"
          else
            git commit -m "style: apply formatter"
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
          fi

      - name: Test
        run: bash .github/scripts/ci/test.sh

      - name: Smoke (container must respond)
        run: bash .github/scripts/ci/smoke.sh
