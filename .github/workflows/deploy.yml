name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      deployToVm:
        description: Replace the VPS container after the image passes its security scan.
        required: false
        type: boolean
        default: true
    outputs:
      image:
        description: Published image repository.
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Immutable published image digest.
        value: ${{ jobs.image.outputs.digest }}
      revision:
        description: Source revision checked out from the release tag.
        value: ${{ jobs.image.outputs.revision }}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-service
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      revision: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Image name
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          version = sys.argv[1]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              sys.exit("Deploy requires a stable SemVer release tag")
          declared = ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version")
          if declared != version:
              sys.exit(f"Ref version {declared!r} does not match requested release {version!r}")
          PY
          IMAGE="ghcr.io/${OWNER}/gym-buddy-service"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            VCS_REF=${{ steps.meta.outputs.source_sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Scan the published image for critical vulnerabilities
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "${IMAGE}@${DIGEST}"
          mkdir -p release-security
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/release-security:/output" \
            aquasec/trivy:0.74.0 image --image-src docker \
            --scanners vuln --severity CRITICAL --exit-code 1 \
            --format json --output /output/released-image-critical.json \
            "${IMAGE}@${DIGEST}"

      - name: Upload released image security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: released-image-security
          path: release-security/
          if-no-files-found: warn

  vm:
    name: vm
    if: ${{ github.event_name == 'push' || inputs.deployToVm }}
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replace script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Replace container on the target machine
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOST:-}" || -z "${USER:-}" || -z "${KEY:-}" ]]; then
            echo "DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY are not set."
            echo "Image was pushed to GHCR. Skipping SSH replace until secrets exist."
            exit 0
          fi
          IMAGE="${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_port="${PORT:-22}"
          ssh-keyscan -p "$ssh_port" -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -P "$ssh_port" deploy/replace.sh "${USER}@${HOST}:/tmp/gym-buddy-replace.sh"
          actor_q=$(printf '%q' "$GHCR_USERNAME")
          token_q=$(printf '%q' "$GHCR_TOKEN")
          image_q=$(printf '%q' "$IMAGE")
          ssh -i ~/.ssh/deploy_key -p "$ssh_port" "${USER}@${HOST}" \
            "chmod +x /tmp/gym-buddy-replace.sh && GHCR_USERNAME=${actor_q} GHCR_TOKEN=${token_q} /tmp/gym-buddy-replace.sh ${image_q}"
