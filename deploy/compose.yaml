# VPS data plane only. Do not use this file on a laptop.
# Laptop stack stays the repo-root compose.yaml (127.0.0.1 published ports).
#
# Private Docker network. Redis stays unpublished; SeaweedFS S3 binds loopback for Caddy.
# Postgres binds 127.0.0.1:5432 only (operator SSH tunnel / pgAdmin).
# Do not publish 0.0.0.0:5432 and do not open UFW 5432.
# The API is not in this file: Release → Deploy still runs deploy/replace.sh,
# which docker-runs the GHCR image on 127.0.0.1:8080 and joins gym-buddy-data.
#
# Operator runbook: docs/vps-data-plane.md

name: gym-buddy-vps

services:
  postgres:
    image: gym-buddy-postgres:18.6-secure
    build: ./postgres
    environment:
      POSTGRES_DB: gymbuddy
      POSTGRES_USER: gymbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=C.UTF-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_icu_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbuddy -d gymbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - data

  storage:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam=false
      - -master.telemetry=false
      - -s3.allowedOrigins=https://projet-de-compensation-2025-2026.github.io
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped
    networks:
      - data


networks:
  data:
    name: gym-buddy-data
    driver: bridge

volumes:
  postgres_icu_data:
  seaweedfs_data:
